<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Quentin State RP - Valley Dispatch CAD</title>
    <style>
        /* Global Themes matching San Quentin's Dark Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* START SHIFT LOGIN SCREEN */
        #login-screen {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        #login-screen h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 24px;
        }

        #login-screen p {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
        }

        .btn-start-shift {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-start-shift:hover {
            background-color: #1d4ed8;
        }

        /* MAIN CAD WORKSPACE (Hidden by Default) */
        #cad-workspace {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }

        /* Header Bar */
        header {
            background-color: #1a1a1a;
            padding: 15px 25px;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 18px;
            letter-spacing: 1px;
            color: #fff;
        }

        .current-user-tag {
            background-color: #2a2a2a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #444;
        }

        /* Main Workspace Grid */
        .cad-grid {
            display: grid;
            grid-template-columns: 280px 1fr 350px;
            flex: 1;
            overflow: hidden;
            background-color: #161616;
        }

        /* Grid Columns Base style */
        .cad-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d2d;
            height: 100%;
            overflow: hidden;
        }

        .panel-title {
            background-color: #1f1f1f;
            padding: 12px 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            border-bottom: 1px solid #2d2d2d;
        }

        /* Left Panel: Active Roster */
        #roster-list {
            padding: 15px;
            list-style: none;
            overflow-y: auto;
        }

        .roster-item {
            background-color: #222;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .roster-item.corrections { border-left-color: #f59e0b; } /* Orange */
        .roster-item.medical { border-left-color: #ef4444; } /* Red */

        .roster-name {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .roster-dept {
            font-size: 11px;
            color: #aaa;
            background-color: #2d2d2d;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Center Panel: Incident Manager */
        .incident-form-container {
            padding: 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #2d2d2d;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .incident-logs-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .logs-table th {
            color: #888;
            padding: 10px;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            font-size: 11px;
        }

        .logs-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #222;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.high { background-color: #7f1d1d; color: #fecaca; }
        .badge.medium { background-color: #7c2d12; color: #ffedd5; }
        .badge.low { background-color: #14532d; color: #dcfce7; }

        /* Right Panel: Radio Tactical Comms Chat */
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            background-color: #222;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-timestamp {
            color: #666;
            font-size: 10px;
            margin-bottom: 3px;
        }

        .chat-sender {
            font-weight: bold;
            color: #3b82f6;
        }

        .chat-input-container {
            padding: 15px;
            background-color: #1a1a1a;
            border-top: 1px solid #2d2d2d;
            display: flex;
            gap: 10px;
        }

        .chat-input-container input {
            flex: 1;
            padding: 10px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            outline: none;
        }

        .btn-send {
            padding: 10px 15px;
            background-color: #3b82f6;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Empty Roster Text Alert */
        .empty-roster-msg {
            color: #555;
            text-align: center;
            font-size: 13px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: START SHIFT SCREEN -->
    <div id="login-screen">
        <h1>Valley Dispatch</h1>
        <p>San Quentin State Roleplay Community CAD</p>
        
        <form id="shift-form" onsubmit="startShift(event)">
            <div class="form-group">
                <label for="user-name">Callsign & Name</label>
                <input type="text" id="user-name" placeholder="e.g. 1L-12 Officer Smith" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="user-dept">Assignment Department</label>
                <select id="user-dept" required>
                    <option value="law-enforcement">Law Enforcement (LEO)</option>
                    <option value="corrections">Corrections Department</option>
                    <option value="medical">Medical / EMS Team</option>
                </select>
            </div>

            <button type="submit" class="btn-start-shift">Start Shift</button>
        </form>
    </div>

    <!-- SECTION 2: LIVE DISPATCH WORKSPACE -->
    <div id="cad-workspace">
        <header>
            <h2>📡 VALLEY MAIN SYSTEM CAD</h2>
            <div id="user-display-tag" class="current-user-tag">Not Configured</div>
        </header>

        <div class="cad-grid">
            
            <!-- Left Grid: Active Units on Shift -->
            <div class="cad-panel">
                <div class="panel-title">Active Shift Roster</div>
                <ul id="roster-list">
                    <p id="empty-msg" class="empty-roster-msg">No units currently active on shift.</p>
                </ul>
            </div>

            <!-- Center Grid: Incident Logger & Active Calls Database -->
            <div class="cad-panel" style="border-right: 1px solid #2d2d2d;">
                <div class="panel-title">Log System Incident</div>
                <div class="incident-form-container">
