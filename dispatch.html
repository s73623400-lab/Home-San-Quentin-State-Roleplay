<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Dispatch</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090b0f;
  color:#f4f4f4;
  line-height:1.6
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 15%,rgba(255,255,255,.07),transparent 35%),
    #090b0f
}

.login-box{
  width:min(500px,100%);
  background:#111419;
  border:1px solid #292f37;
  border-radius:16px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)
}

.login-logo{
  text-align:center;
  font-size:48px;
  margin-bottom:5px
}

.login-box h1{
  text-align:center;
  font-size:28px
}

.login-box>p{
  text-align:center;
  color:#858c96;
  margin:5px 0 25px
}

.field{margin-bottom:15px}

.field label{
  display:block;
  color:#cdd1d7;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#090b0f;
  border:1px solid #303640;
  color:white;
  border-radius:8px;
  padding:12px;
  outline:none
}

.field textarea{
  min-height:100px;
  resize:vertical
}

.btn{
  display:inline-block;
  padding:12px 20px;
  border-radius:8px;
  border:1px solid #3b414a;
  background:#171b21;
  color:white;
  font-weight:800;
  font-size:14px;
  transition:.2s
}

.btn:hover{
  transform:translateY(-2px);
  background:#22272e
}

.btn.primary{
  background:#f1f1f1;
  color:#090b0f;
  border-color:#f1f1f1
}

.login-box .btn{
  width:100%;
  margin-top:5px
}

.error{
  color:#ff9999;
  font-size:13px;
  margin-top:12px;
  text-align:center
}

/* DISPATCH */

.dispatch-app{
  min-height:100vh;
  display:none
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:70px;
  background:rgba(9,11,15,.97);
  border-bottom:1px solid #292f37;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 25px;
  gap:15px
}

.title{
  display:flex;
  align-items:center;
  gap:12px
}

.title h1{font-size:22px}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(60,190,105,.1);
  color:#8ee5aa;
  border:1px solid rgba(60,190,105,.3);
  font-size:11px;
  font-weight:800
}

.dot{
  width:8px;
  height:8px;
  background:#63d986;
  border-radius:50%;
  display:inline-block
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px
}

.user-name{
  color:#aeb4bd;
  font-size:13px
}

.off-duty{
  border:1px solid #393f47;
  background:transparent;
  color:#aeb4bd;
  border-radius:7px;
  padding:8px 12px;
  font-weight:700
}

.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 70px)
}

.sidebar{
  background:#0d1014;
  border-right:1px solid #292f37;
  padding:18px
}

.sidebar-title{
  color:#686f79;
  text-transform:uppercase;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  margin:15px 10px 8px
}

.nav-btn{
  width:100%;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:#aeb4bd;
  padding:11px 12px;
  border-radius:8px;
  margin-bottom:6px;
  font-weight:700
}

.nav-btn:hover,
.nav-btn.active{
  background:#191e24;
  border-color:#303640;
  color:white
}

.main{
  padding:25px;
  overflow:auto
}

.panel{display:none}
.panel.active{display:block}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px
}

.stat{
  background:#0d1014;
  border:1px solid #282e36;
  border-radius:10px;
  padding:17px
}

.stat small{
  display:block;
  color:#747c87;
  text-transform:uppercase;
  font-size:10px;
  margin-bottom:4px
}

.stat strong{font-size:25px}

.card{
  background:#0d1014;
  border:1px solid #282e36;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px
}

.card h2{
  font-size:17px;
  margin-bottom:14px
}

.empty{
  text-align:center;
  padding:35px;
  color:#747c87
}

/* OFFICERS */

.officer-list{
  display:grid;
  gap:10px
}

.officer{
  background:#111419;
  border:1px solid #292f37;
  border-radius:10px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.officer-left{
  display:flex;
  align-items:center;
  gap:11px
}

.online-dot{
  width:10px;
  height:10px;
  background:#63d986;
  border-radius:50%;
  box-shadow:0 0 8px rgba(99,217,134,.6)
}

.officer-name{font-weight:800}

.officer-rank{
  color:#747c87;
  font-size:11px
}

.on-shift{
  color:#8ee5aa;
  font-size:11px;
  font-weight:800
}

/* INCIDENTS */

.incident-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.full{grid-column:1/-1}

.incident-list{
  display:grid;
  gap:10px
}

.incident{
  background:#111419;
  border:1px solid #292f37;
  border-radius:10px;
  padding:14px
}

.incident-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px
}

.incident-type{font-weight:800}

.incident-time{
  color:#747c87;
  font-size:10px
}

.incident-location{
  color:#aeb4bd;
  font-size:13px
}

.incident-description{
  color:#9298a1;
  font-size:13px;
  margin-top:6px
}

.priority{
  font-size:10px;
  color:#888;
  margin-left:5px
}

/* CHAT */

.chat{
  height:500px;
  display:flex;
  flex-direction:column
}

.messages{
  flex:1;
  overflow-y:auto;
  background:#090b0f;
  border:1px solid #292f37;
  border-radius:10px;
  padding:13px;
  margin-bottom:10px
}

.message{margin-bottom:13px}

.message-author{
  font-size:12px;
  font-weight:800
}

.message-time{
  color:#666d76;
  font-size:10px;
  margin-left:6px
}

.message-text{
  color:#c3c7ce;
  font-size:13px
}

.send{
  display:flex;
  gap:8px
}

.send input{
  flex:1;
  background:#090b0f;
  border:1px solid #303640;
  color:white;
  border-radius:8px;
  padding:11px
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    border-right:0;
    border-bottom:1px solid #292f37
  }

  .stats{
    grid-template-columns:1fr
  }

  .topbar{
    flex-wrap:wrap
  }
}

@media(max-width:600px){

  .main{padding:15px}

  .incident-form{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .user-name{
    display:none
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-page">

<div class="login-box">

<div class="login-logo">🚨</div>

<h1>Valley Dispatch</h1>

<p>Officer Sign In</p>

<form id="loginForm">

<div class="field">

<label for="officerName">Name</label>

<input
id="officerName"
type="text"
placeholder="Your name"
required
maxlength="50"
>

</div>

<div class="field">

<label for="officerRank">Rank</label>

<input
id="officerRank"
type="text"
placeholder="Officer / Sergeant / etc."
required
maxlength="50"
>

</div>

<button class="btn primary" type="submit">
🚨 GO ON DUTY
</button>

</form>

<div id="loginError" class="error"></div>

</div>

</div>


<!-- DISPATCH APP -->

<div id="dispatchApp" class="dispatch-app">

<header class="topbar">

<div class="title">

<h1>🚨 Valley Dispatch</h1>

<span class="live">
<span class="dot"></span>
LIVE
</span>

</div>

<div class="user-area">

<span id="currentUser" class="user-name"></span>

<button id="offDutyButton" class="off-duty">
Go Off Duty
</button>

</div>

</header>


<div class="layout">

<aside class="sidebar">

<div class="sidebar-title">
Dispatch
</div>

<button
class="nav-btn active"
data-panel="dashboard"
>
📊 Dashboard
</button>

<button
class="nav-btn"
data-panel="officers"
>
👮 Officers On Shift
</button>

<button
class="nav-btn"
data-panel="incidents"
>
🚨 Incidents
</button>

<button
class="nav-btn"
data-panel="chat"
>
💬 Officer Chat
</button>

</aside>


<main class="main">


<!-- DASHBOARD -->

<section id="panel-dashboard" class="panel active">

<div class="stats">

<div class="stat">

<small>Officers On Shift</small>

<strong id="officerCount">0</strong>

</div>

<div class="stat">

<small>Total Incidents</small>

<strong id="incidentCount">0</strong>

</div>

<div class="stat">

<small>System</small>

<strong style="font-size:18px">
ONLINE
</strong>

</div>

</div>


<div class="card">

<h2>👮 Officers Currently On Shift</h2>

<div id="dashboardOfficers" class="officer-list"></div>

</div>


<div class="card">

<h2>🚨 Latest Incidents</h2>

<div id="dashboardIncidents" class="incident-list"></div>

</div>

</section>


<!-- OFFICERS -->

<section id="panel-officers" class="panel">

<div class="card">

<h2>👮 Officers On Shift</h2>

<div id="officerList" class="officer-list"></div>

</div>

</section>


<!-- INCIDENTS -->

<section id="panel-incidents" class="panel">

<div class="card">

<h2>➕ Log New Incident</h2>

<form id="incidentForm">

<div class="incident-form">

<div class="field">

<label>Incident Type</label>

<select id="incidentType" required>

<option value="">Select incident</option>
<option>Disturbance</option>
<option>Medical Emergency</option>
<option>Security Alert</option>
<option>Contraband Report</option>
<option>Welfare Check</option>
<option>Other</option>

</select>

</div>


<div class="field">

<label>Priority</label>

<select id="incidentPriority">

<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>

</select>

</div>


<div class="field">

<label>Location</label>

<input
id="incidentLocation"
type="text"
placeholder="Example: Cell Block A"
required
maxlength="100"
>

</div>


<div class="field">

<label>Responding Unit</label>

<input
id="incidentUnit"
type="text"
placeholder="Example: Unit 12"
maxlength="50"
>

</div>


<div class="field full">

<label>Description</label>

<textarea
id="incidentDescription"
placeholder="Describe the incident..."
required
maxlength="1000"
></textarea>

</div>


<div class="full">

<button
class="btn primary"
type="submit"
>
🚨 Log Incident
</button>

</div>

</div>

</form>

</div>


<div class="card">

<h2>📋 Incident History</h2>

<div id="incidentList" class="incident-list"></div>

</div>

</section>


<!-- CHAT -->

<section id="panel-chat" class="panel">

<div class="card">

<h2>💬 Officer Chat</h2>

<div class="chat">

<div id="messages" class="messages"></div>

<form id="chatForm" class="send">

<input
id="chatInput"
type="text"
placeholder="Message officers..."
autocomplete="off"
maxlength="500"
required
>

<button class="btn primary" type="submit">
Send
</button>

</form>

</div>

</div>

</section>

</main>

</div>

</div>


<script>

/*
========================================
VALLEY DISPATCH
========================================

This uses browser localStorage.

It allows index.html and dispatch.html
to use the same stored information when
they are on the same browser/domain.

For different people's computers,
a shared database such as Supabase is
required.
========================================
*/

let currentOfficer = null;


/* STORAGE */

function getOfficers(){

try{

return JSON.parse(
localStorage.getItem("valley_officers") || "[]"
);

}catch(error){

return [];

}

}


function saveOfficers(officers){

localStorage.setItem(
"valley_officers",
JSON.stringify(officers)
);

}


function getIncidents(){

try{

return JSON.parse(
localStorage.getItem("valley_incidents") || "[]"
);

}catch(error){

return [];

}

}


function saveIncidents(incidents){

localStorage.setItem(
"valley_incidents",
JSON.stringify(incidents)
);

}


function getMessages(){

try{

return JSON.parse(
localStorage.getItem("valley_messages") || "[]"
);

}catch(error){

return [];

}

}


function saveMessages(messages){

localStorage.setItem(
"valley_messages",
JSON.stringify(messages)
);

}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",function(event){

event.preventDefault();

const name =
document
.getElementById("officerName")
.value
.trim();

const rank =
document
.getElementById("officerRank")
.value
.trim();

if(!name || !rank){

return;

}


currentOfficer={
name:name,
rank:rank
};


let officers=getOfficers();


officers=officers.filter(
officer =>
officer.name.toLowerCase()
!== name.toLowerCase()
);


officers.push({

name:name,
rank:rank,
onShift:true,
lastSeen:Date.now()

});


saveOfficers(officers);

showDispatch();

});


/* SHOW DISPATCH */

function showDispatch(){

document
.getElementById("loginPage")
.style.display="none";

document
.getElementById("dispatchApp")
.style.display="block";

document
.getElementById("currentUser")
.textContent=
currentOfficer.name+
" • "+
currentOfficer.rank;

refreshEverything();

}


/* GO OFF DUTY */

document
.getElementById("offDutyButton")
.addEventListener("click",function(){

if(!currentOfficer){
return;
}


let officers=getOfficers();


officers=officers.filter(
officer =>
officer.name.toLowerCase()
!== currentOfficer.name.toLowerCase()
);


saveOfficers(officers);


currentOfficer=null;


document
.getElementById("dispatchApp")
.style.display="none";

document
.getElementById("loginPage")
.style.display="flex";

document
.getElementById("loginForm")
.reset();

refreshEverything();

});


/* NAVIGATION */

document
.querySelectorAll(".nav-btn")
.forEach(button=>{

button.addEventListener("click",function(){

document
.querySelectorAll(".nav-btn")
.forEach(btn =>
btn.classList.remove("active")
);

document
.querySelectorAll(".panel")
.forEach(panel =>
panel.classList.remove("active")
);

this.classList.add("active");

document
.getElementById(
"panel-"+this.dataset.panel
)
.classList.add("active");

});

});


/* OFFICERS */

function loadOfficers(){

const officers=getOfficers();

const onShift=officers.filter(
officer=>officer.onShift
);


document
.getElementById("officerCount")
.textContent=
onShift.length;


const lists=[

document.getElementById("officerList"),

document.getElementById("dashboardOfficers")

];


if(!onShift.length){

lists.forEach(list=>{

list.innerHTML=
'<div class="empty">No officers currently on shift.</div>';

});

return;

}


const html=
onShift.map(officer=>`

<div class="officer">

<div class="officer-left">

<span class="online-dot"></span>

<div>

<div class="officer-name">
${escapeHTML(officer.name)}
</div>

<div class="officer-rank">
${escapeHTML(officer.rank)}
</div>

</div>

</div>

<span class="on-shift">
ON SHIFT
</span>

</div>

`).join("");


lists.forEach(list=>{
list.innerHTML=html;
});

}


/* INCIDENTS */

document
.getElementById("incidentForm")
.addEventListener("submit",function(event){

event.preventDefault();

if(!currentOfficer){
return;
}


const incidents=getIncidents();


const incident={

type:
document
.getElementById("incidentType")
.value,

priority:
document
.getElementById("incidentPriority")
.value,

location:
document
.getElementById("incidentLocation")
.value
.trim(),

unit:
document
.getElementById("incidentUnit")
.value
.trim(),

description:
document
.getElementById("incidentDescription")
.value
.trim(),

officer:
currentOfficer.name,

time:
new Date().toLocaleString(),

timestamp:
Date.now()

};


incidents.unshift(incident);

saveIncidents(incidents);


document
.getElementById("incidentForm")
.reset();


loadIncidents();

});


function loadIncidents(){

const incidents=getIncidents();


document
.getElementById("incidentCount")
.textContent=
incidents.length;


const lists=[

document.getElementById("incidentList"),

document.getElementById("dashboardIncidents")

];


if(!incidents.length){

lists.forEach(list=>{

list.innerHTML=
'<div class="empty">No incidents logged yet.</div>';

});

return;

}


const createHTML=incident=>`

<div class="incident">

<div class="incident-header">

<span class="incident-type">

🚨 ${escapeHTML(incident.type)}

<span class="priority">
• ${escapeHTML(incident.priority)}
</span>

</span>

<span class="incident-time">
${escapeHTML(incident.time)}
</span>

</div>

<div class="incident-location">
📍 ${escapeHTML(incident.location)}
</div>

<div class="incident-description">

${escapeHTML(incident.description)}

<br><br>

<span style="color:#747c87">

Unit:
${escapeHTML(incident.unit||"Not assigned")}

•

Logged by:
${escapeHTML(incident.officer)}

</span>

</div>

</div>

`;


lists[0].innerHTML=
incidents.map(createHTML).join("");


lists[1].innerHTML=
incidents
.slice(0,5)
.map(createHTML)
.join("");

}


/* CHAT */

document
.getElementById("chatForm")
.addEventListener("submit",function(event){

event.preventDefault();

if(!currentOfficer){
return;
}


const input=
document.getElementById("chatInput");

const text=
input.value.trim();

if(!text){
return;
}


const messages=getMessages();


messages.push({

name:currentOfficer.name,

rank:currentOfficer.rank,

text:text,

time:new Date().toLocaleTimeString(),

timestamp:Date.now()

});


saveMessages(messages);


input.value="";

loadMessages();

});


function loadMessages(){

const messages=getMessages();

const container=
document.getElementById("messages");


if(!messages.length){

container.innerHTML=
'<div class="empty">No messages yet.</div>';

return;

}


container.innerHTML=
messages
.map(message=>`

<div class="message">

<span class="message-author">

${escapeHTML(message.name)}
• ${escapeHTML(message.rank)}

</span>

<span class="message-time">

${escapeHTML(message.time)}

</span>

<div class="message-text">

${escapeHTML(message.text)}

</div>

</div>

`)
.join("");


container.scrollTop=
container.scrollHeight;

}


/* REFRESH */

function refreshEverything(){

loadOfficers();
loadIncidents();
loadMessages();

}


/* Refresh the display regularly */

setInterval(function(){

refreshEverything();

},1000);


/* Listen for changes from another
browser tab on the same origin */

window.addEventListener(
"storage",
function(){

refreshEverything();

});


/* SECURITY */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
